<div class="align-r">
  <span class="step-links">
    {% if page.has_previous %}
      <a href="?page=1&{{ parameters }}">First</a>
      -
      <a href="?page={{ page.previous_page_number }}&{{ parameters }}">Previous</a>
    {% endif %}
    <span class="current">Page <b>{{ page.number }}</b> of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a href="?page={{ page.next_page_number }}&{{ parameters }}">Next</a>
      -
      <a href="?page={{ page.paginator.num_pages }}&{{ parameters }}">Last</a>
    {% endif %}
  </span>
</div>
